name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The shared RFC proof: build, vet, lint, race tests with the 95% statement
  # coverage gate (reasons in COVERAGE.md), the CHECKLIST.md check, and each
  # fuzz target for 30 seconds. Pinned to one reviewed commit of go-spf.
  rfc:
    name: Verify RFC
    uses: rest-mail/go-spf/.github/workflows/rfc-verification.yml@7d291c08d310b9c62afc287e75a534a39150fafb
    with:
      packages: '["./..."]'
      checklist-dirs: '["./pkg/arc", "./pkg/arc/internal/grammar", "./pkg/arc/rfctest"]'
      fuzz-targets: >-
        [{"package":"./pkg/arc/internal/grammar","target":"FuzzFieldInstance"},
         {"package":"./pkg/arc","target":"FuzzVerify"}]

  # Preserve the existing required context. A skipped or cancelled proof job
  # must never produce a successful Build & Test verdict.
  build:
    name: Build & Test
    needs: [rfc]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the RFC proof to succeed
        env:
          RFC_RESULT: ${{ needs.rfc.result }}
        run: test "$RFC_RESULT" = success
